services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "127.0.0.1:6333:6333"
    environment:
      QDRANT__SERVICE__API_KEY: "${QDRANT_API_KEY:?Provision QDRANT_API_KEY before starting Qdrant}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
