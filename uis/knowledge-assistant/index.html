<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Asistente de Operaciones | Brasaland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f5ef;
      --ink: #1f2924;
      --muted: #66716a;
      --line: #d8ded7;
      --surface: #fffefa;
      --green: #1f6b4a;
      --green-dark: #164d36;
      --red: #a43b2f;
      --focus: #d18b41;
      font-family: "Manrope", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--page);
      background-image: repeating-linear-gradient(135deg, transparent 0 18px, rgb(31 107 74 / 3%) 18px 19px);
    }

    header {
      min-height: 68px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 5vw, 72px);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--green);
      font-family: "DM Serif Display", serif;
      font-size: 19px;
    }

    .brand small {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
    }

    main {
      width: min(760px, calc(100% - 36px));
      margin: clamp(48px, 10vh, 96px) auto 64px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "DM Serif Display", Georgia, serif;
      font-size: clamp(34px, 7vw, 50px);
      font-weight: 400;
      line-height: 1.08;
    }

    form { margin-top: 34px; }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 132px;
      resize: vertical;
      padding: 16px 17px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
      font-size: 15px;
      line-height: 1.6;
    }

    textarea:focus-visible, button:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 58px;
    }

    button {
      min-height: 42px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--green);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: var(--green-dark); }
    button:disabled { cursor: wait; opacity: .7; }

    [hidden] { display: none !important; }

    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .error {
      color: var(--red);
      font-size: 13px;
    }

    .answer {
      margin-top: 26px;
      padding: 2px 0 2px 20px;
      border-left: 3px solid var(--green);
    }

    .answer h2 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 700;
    }

    .answer p {
      margin: 0;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.75;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171e1a;
        --ink: #edf2ed;
        --muted: #a6b2a9;
        --line: #36433a;
        --surface: #202a24;
        --green: #73c497;
        --green-dark: #91d5ad;
        --red: #ff9b8d;
        --focus: #efbd78;
      }
      .brand-mark, button { color: #10251a; }
    }

    @media (max-width: 480px) {
      header { min-height: 60px; }
      main { margin-top: 42px; }
      .actions { align-items: flex-start; flex-direction: column; padding-top: 12px; }
    }
  </style>
</head>
<body data-api-url="http://localhost:8000">
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">B</span>
      <span>Brasaland<small>Asistente de Operaciones</small></span>
    </div>
  </header>

  <main>
    <p class="eyebrow">Base de conocimiento</p>
    <h1>Asistente de Operaciones</h1>

    <form id="question-form">
      <label for="question">Pregunta</label>
      <textarea id="question" name="question" maxlength="2000" required placeholder="¿Cuántos puntos necesito para el nivel Oro?"></textarea>
      <div class="actions">
        <button id="submit-button" type="submit">Consultar</button>
        <span id="loading" class="status" role="status" hidden>Consultando...</span>
        <span id="error" class="error" role="alert" hidden></span>
      </div>
    </form>

    <section id="answer-section" class="answer" aria-live="polite" hidden>
      <h2>Respuesta</h2>
      <p id="answer"></p>
    </section>
  </main>

  <script>
    const form = document.querySelector("#question-form");
    const questionInput = document.querySelector("#question");
    const submitButton = document.querySelector("#submit-button");
    const loading = document.querySelector("#loading");
    const errorMessage = document.querySelector("#error");
    const answerSection = document.querySelector("#answer-section");
    const answerText = document.querySelector("#answer");
    const apiUrl = document.body.dataset.apiUrl;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question) return;

      submitButton.disabled = true;
      loading.hidden = false;
      errorMessage.hidden = true;
      answerSection.hidden = true;

      try {
        const response = await fetch(`${apiUrl}/knowledge/query`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        if (!response.ok) throw new Error("request_failed");
        const result = await response.json();
        if (typeof result.answer !== "string" || !result.answer.trim()) {
          throw new Error("invalid_response");
        }
        answerText.textContent = result.answer;
        answerSection.hidden = false;
      } catch {
        errorMessage.textContent = "No se pudo obtener una respuesta. Comprueba la conexión e inténtalo de nuevo.";
        errorMessage.hidden = false;
      } finally {
        submitButton.disabled = false;
        loading.hidden = true;
      }
    });
  </script>
</body>
</html>
