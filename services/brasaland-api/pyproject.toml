[project]
name = "brasaland-api"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jeancarreras", email = "Jeancarrerasdraw@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "libpass[bcrypt]>=1.9.3",
    "pydantic==2.11.7",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "tinydb>=4.8.0",
    "uvicorn==0.35.0",
]

[project.scripts]
brasaland-api = "brasaland_api:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
