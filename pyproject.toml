[project]
name = "brasaland-forecasting"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.4,<2",
    "matplotlib>=3.11.2",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pytest>=9.1.1",
    "scikit-learn>=1.6,<2",
    "scipy>=1.14,<2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
]
